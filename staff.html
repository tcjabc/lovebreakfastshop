<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>樂福 Orders — Staff</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="staff-style.css" />
</head>
<body>

  <header class="staff-header">
    <div class="staff-header-left">
      <!-- Logo placeholder — swap for <img class="logo-placeholder" src="logo.png"
           width="42" height="42" alt=""> (same 42px size) once the real logo
           exists. No other layout changes needed at that point. -->
      <div class="logo-placeholder" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="3" y="3" width="18" height="18" rx="3" stroke="rgba(255,255,255,0.55)" stroke-width="1.5" />
          <circle cx="8.5" cy="8.5" r="1.5" stroke="rgba(255,255,255,0.55)" stroke-width="1.5" />
          <path d="M21 15l-5-5-9 9" stroke="rgba(255,255,255,0.55)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </div>
      <div class="shop-header-text">
        <h1 id="staff-shop-name">Loading…</h1>
        <p class="staff-subtitle">訂單 Orders</p>
      </div>
    </div>
    <button id="connect-printer-btn" class="connect-btn">🖨️ 連接印表機 Connect printer</button>
  </header>

  <div class="columns">
    <section class="column">
      <h2 class="col-title pending">待處理 Pending</h2>
      <div id="col-pending" class="order-cards"></div>
    </section>
    <section class="column">
      <h2 class="col-title preparing">製作中 Preparing</h2>
      <div id="col-preparing" class="order-cards"></div>
    </section>
    <section class="column">
      <h2 class="col-title ready">可取餐 Ready</h2>
      <div id="col-ready" class="order-cards"></div>
    </section>
  </div>

  <!-- Test orders (is_test = true) — kept out of the three live
       columns and out of auto-print entirely (see refresh()/
       autoPrintPendingOrders() in staff.js), but still checkable here:
       Print/Preview/status buttons all work the same as a live order.
       <details> so staff can collapse it out of the way during
       service instead of it competing for attention with the live
       queue — closed by default; staff.js only ever touches the
       [hidden] attribute (whether it shows at all), never `open`
       (collapsed/expanded), so a staff member's manual toggle survives
       every 5s refresh() poll instead of snapping back open/closed
       underneath them. Hidden entirely when there's nothing to show. -->
  <details id="test-orders-section" class="test-orders-section" hidden>
    <summary class="test-orders-heading">🧪 測試訂單 Test Orders（不會自動列印 won't auto-print）</summary>
    <div id="col-test" class="order-cards"></div>
  </details>

  <!-- Receipt preview — plain-text rendering of buildReceiptModel(),
       so print.js's layout/alignment can be checked without a
       physical test print. See ThermalPrinter.buildReceiptPreview. -->
  <div id="receipt-preview-backdrop" class="preview-backdrop" hidden></div>
  <div id="receipt-preview" class="receipt-preview" hidden aria-label="Receipt preview">
    <div class="receipt-preview-header">
      <span>收據預覽 Receipt preview</span>
      <button id="receipt-preview-close" class="receipt-preview-close" aria-label="close">✕</button>
    </div>
    <div id="receipt-preview-body" class="receipt-preview-body"></div>
  </div>

  <template id="order-card-template">
    <div class="order-card">
      <div class="order-card-top">
        <span class="order-id"></span>
        <span class="order-time"></span>
      </div>
      <div class="order-items"></div>
      <div class="order-note"></div>
      <div class="order-total"></div>
      <div class="order-actions"></div>
    </div>
  </template>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="menu.js"></script>
  <script src="supabase-config.js"></script>
  <script src="print.js"></script>
  <script src="staff.js"></script>
</body>
</html>
