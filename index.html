<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>樂福</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="shop-header">
    <!-- Logo placeholder — swap for <img class="logo-placeholder" src="logo.png"
         width="42" height="42" alt=""> (same 42px size) once the real logo
         exists. No other layout changes needed at that point. -->
    <div class="logo-placeholder" aria-hidden="true">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="3" y="3" width="18" height="18" rx="3" stroke="rgba(43,33,28,0.55)" stroke-width="1.5" />
        <circle cx="8.5" cy="8.5" r="1.5" stroke="rgba(43,33,28,0.55)" stroke-width="1.5" />
        <path d="M21 15l-5-5-9 9" stroke="rgba(43,33,28,0.55)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </div>
    <div class="shop-header-text">
      <h1 id="shop-name">載入中…</h1>
      <p id="shop-note" class="pickup-note"></p>
    </div>

    <!-- Signed-in indicator / "become a member" pill — exactly one of
         these two is ever shown at a time (see syncMemberState() in
         app.js), toggled the same [hidden]-override way as
         .cart-bar/.confirm-screen below. Badge: shown once a silent
         liff.isLoggedIn() check at page load finds an existing
         session — no prompt, just reflecting a state that's already
         true; now itself a button opening #member-menu (see below).
         Pill: shown otherwise; tapping it opens the benefits card
         (#benefits-card) below, the only path (besides checkout) that
         can trigger an actual liff.login(). -->
    <button id="member-badge" class="member-badge" type="button" hidden aria-haspopup="true" aria-expanded="false">
      <img id="member-avatar" class="member-avatar" alt="" hidden />
      <span id="member-name" class="member-name"></span>
    </button>
    <button id="member-pill" class="member-pill" hidden>成為會員</button>

    <!-- Member menu — a small popover anchored to #member-badge
         (opened/closed by toggleMemberMenu() in app.js). Deliberately
         built as a bare list shell with exactly one entry today (登出)
         so future entries (order history, stored value balance, stamp
         card progress, favourites) can be appended as more
         .member-menu-item buttons later without redesigning this.
         Backdrop is a plain click-outside catcher, not a dimming
         overlay like the sheet dialogs below — this is a small
         anchored popover, not a full sheet. -->
    <div id="member-menu-backdrop" class="member-menu-backdrop" hidden></div>
    <div id="member-menu" class="member-menu" role="menu" aria-label="會員選單" hidden>
      <button id="member-menu-logout" class="member-menu-item" role="menuitem" type="button">登出</button>
    </div>
  </header>

  <div class="search-bar">
    <input id="search-input" type="search" class="search-input" placeholder="搜尋餐點" autocomplete="off" />
  </div>

  <div id="popular-row-wrap" class="popular-row-wrap" hidden>
    <div class="popular-row-title">熱門商品</div>
    <div id="popular-row" class="popular-row">
      <!-- cards injected by app.js, one per item tagged (熱門)/(熱門?) -->
    </div>
  </div>

  <!-- Member-only — hidden entirely while logged out. Shows 我的最愛
       (favourited items) whenever the member has any; with zero
       favourites, shows 常買推薦 (top items from their own order
       history) instead; with neither, stays hidden. Exactly one of
       those two states at a time — see renderMemberPicksRow() in
       app.js, which also owns the title text since it switches between
       the two. Same .popular-row-wrap/.popular-row-title/.popular-row
       classes and buildPopularCard() component as 熱門 above —
       deliberately the same look, not a new visual pattern. -->
  <div id="member-picks-wrap" class="popular-row-wrap" hidden>
    <div id="member-picks-title" class="popular-row-title"></div>
    <div id="member-picks-row" class="popular-row"></div>
  </div>

  <main id="menu-list" class="menu-list">
    <!-- accordion categories (browse mode) or flat matches (search mode), injected by app.js -->
  </main>

  <div id="empty-state" class="empty-state" hidden>
    <p>目前無法載入菜單</p>
    <p class="empty-sub">請從 LINE 聊天室重新開啟</p>
  </div>

  <button id="cart-bar" class="cart-bar" hidden>
    <span class="cart-summary">
      <span id="cart-count">0 件</span>
      <span id="cart-total">NT$0</span>
    </span>
    <span class="cart-cta">查看訂單</span>
  </button>

  <!-- Checkout sheet -->
  <div id="sheet-backdrop" class="sheet-backdrop" hidden></div>
  <section id="checkout-sheet" class="checkout-sheet" hidden aria-label="Your order">
    <div class="sheet-handle"></div>
    <h2>你的訂單</h2>
    <div id="sheet-items" class="sheet-items"></div>
    <div class="sheet-total-row">
      <span>總計</span>
      <span id="sheet-total">NT$0</span>
    </div>

    <!-- Stored Value payment choice — hidden by default; shown only
         when renderPaymentMethodSection() (app.js, called from
         openSheet() every time this sheet opens) confirms the visitor
         is logged in AND their balance covers the current total. A
         guest, or a member whose balance doesn't cover it, never sees
         this at all — no partial-spend UI, matching the existing
         no-partial-split decision elsewhere in this app. 現場付款 stays
         the checked default even when stored value would cover the
         order — deliberate, not an oversight. -->
    <div id="payment-method-section" class="payment-method-section" hidden>
      <div class="payment-method-title">付款方式</div>
      <label class="payment-method-row">
        <input type="radio" id="payment-method-cash" name="payment-method" value="cash_on_pickup" checked />
        <span>現場付款</span>
      </label>
      <label class="payment-method-row">
        <input type="radio" id="payment-method-stored-value" name="payment-method" value="stored_value" />
        <span id="payment-method-stored-value-text">使用儲值支付</span>
      </label>
    </div>

    <label class="note-label" for="order-note">備註</label>
    <input id="order-note" class="note-input" type="text" placeholder="例如：不要香菜" />
    <button id="submit-order" class="submit-btn">送出訂單</button>
    <button id="close-sheet" class="close-sheet-btn">繼續選購</button>
  </section>

  <!-- Item customization -->
  <div id="options-backdrop" class="sheet-backdrop" hidden></div>
  <section id="options-sheet" class="checkout-sheet" hidden aria-label="Item options">
    <div class="sheet-handle"></div>
    <h2 id="options-title"></h2>
    <div id="options-content"></div>
    <div class="stepper" id="options-qty-stepper">
      <button id="options-qty-decrement" class="decrement" aria-label="minus">−</button>
      <span class="qty" id="options-qty">1</span>
      <button id="options-qty-increment" class="add-btn" aria-label="plus">＋</button>
    </div>
    <div class="sheet-total-row">
      <span>小計</span>
      <span id="options-subtotal">NT$0</span>
    </div>
    <button id="options-add" class="submit-btn">加入購物車</button>
    <button id="options-cancel" class="close-sheet-btn">取消</button>
  </section>

  <!-- Member benefits — opened by tapping #member-pill (app.js:
       openBenefitsCard()). Purely informational plus one action; the
       X and backdrop tap both just close it (closeBenefitsCard()) with
       zero other side effects — no flag set, nothing recorded, always
       reopenable via the pill. Only #benefits-login calls
       liff.login() (via loginWithLine()). -->
  <div id="benefits-backdrop" class="sheet-backdrop" hidden></div>
  <section id="benefits-card" class="checkout-sheet" hidden aria-label="Member benefits">
    <div class="sheet-handle"></div>
    <div class="benefits-header">
      <h2>會員福利</h2>
      <button id="benefits-close" class="benefits-close-btn" aria-label="close">✕</button>
    </div>
    <!-- Rows are rendered by renderBenefitRows() (app.js) from one
         shared MEMBER_BENEFIT_CAPTIONS list — also used for
         #checkout-benefits-rows below, so the two can't drift apart. -->
    <div id="benefits-rows" class="benefit-rows"></div>
    <button id="benefits-login" class="line-login-btn">
      <img class="line-login-icon" src="assets/line-icon.png" alt="" />
      <span class="line-login-divider" aria-hidden="true"></span>
      <span class="line-login-text">與LINE連動</span>
    </button>
  </section>

  <!-- Checkout sign-in-or-guest choice — shown by submitOrder() (app.js)
       for a currently-anonymous visitor who hasn't already chosen
       guest checkout this session (see guestCheckoutChosen). Dismissing
       via the backdrop picks neither option: the order is NOT placed,
       same as tapping nothing. -->
  <div id="checkout-auth-backdrop" class="sheet-backdrop" hidden></div>
  <section id="checkout-auth-dialog" class="checkout-sheet" hidden aria-label="Sign in or continue as guest">
    <div class="sheet-handle"></div>
    <h2>登入或以訪客結帳</h2>
    <div id="checkout-benefits-rows" class="benefit-rows"></div>
    <!-- Side by side above the mobile breakpoint, stacked below it —
         see .checkout-auth-actions in style.css for why (legibility
         at genuinely narrow widths beats forcing the layout). -->
    <div class="checkout-auth-actions">
      <button id="checkout-auth-line" class="line-login-btn">
        <img class="line-login-icon" src="assets/line-icon.png" alt="" />
        <span class="line-login-divider" aria-hidden="true"></span>
        <span class="line-login-text">與LINE連動</span>
      </button>
      <button id="checkout-auth-guest" class="close-sheet-btn">以訪客身份下單</button>
    </div>
  </section>

  <!-- Confirmation -->
  <section id="confirm-screen" class="confirm-screen" hidden>
    <div class="confirm-icon">✓</div>
    <h2>訂單已送出！</h2>
    <p id="confirm-order-id"></p>
    <p id="confirm-wait" class="confirm-wait"></p>
    <button id="confirm-close" class="submit-btn">關閉</button>
  </section>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="menu.js"></script>
  <script src="supabase-config.js"></script>
  <script src="app.js"></script>
</body>
</html>
