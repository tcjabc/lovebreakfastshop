<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>樂福</title>
<!-- Installable as its own app (樂福店務), separate from the customer
     app. The manifest lives at the site ROOT (/staff.webmanifest), not
     under /staff/: the Worker PIN-gates everything under /staff/, and
     Chrome fetches manifests without cookies, so a manifest in here
     would come back as the PIN page. Icons are the public /assets ones. -->
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png?v=20260928" />
<link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png?v=20260928" />
<link rel="manifest" href="/staff.webmanifest" />
<meta name="theme-color" content="#fbefe6" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="staff-style.css?v=20260928-2" />
</head>
<body>

  <!-- Staff account sign-in (Supabase Auth) — shown instead of the
       dashboard whenever staff.js finds no valid session. This sits
       BEHIND the Worker's PIN gate (worker.js), which still guards the
       whole /staff/ subtree; this login is what gives the dashboard's
       database requests the `authenticated` role. Needed once per
       device — supabase-js keeps and refreshes the session after that
       (under its own storage key, see STAFF_AUTH_STORAGE_KEY). -->
  <section id="staff-login" class="staff-login" hidden>
    <div class="staff-login-card">
      <img class="logo-placeholder" src="../assets/logo.png?v=20260928" width="42" height="42" alt="樂福" />
      <h1 class="staff-login-title">店務帳號登入</h1>
      <p class="staff-login-hint">每台裝置只需登入一次</p>
      <p id="staff-login-message" class="staff-login-message" hidden></p>
      <form id="staff-login-form" novalidate>
        <label class="note-label" for="staff-login-email">電子郵件</label>
        <input id="staff-login-email" class="note-input" type="email" autocomplete="username" required />
        <label class="note-label" for="staff-login-password">密碼</label>
        <input id="staff-login-password" class="note-input" type="password" autocomplete="current-password" required />
        <p id="staff-login-error" class="staff-login-error" hidden></p>
        <button id="staff-login-submit" class="submit-btn" type="submit">登入</button>
      </form>
    </div>
  </section>

  <!-- Everything below the sign-in screen. A plain wrapper div (no CSS
       display rule of its own) so [hidden] reliably hides it —
       .staff-header sets display:flex unconditionally, so hiding the
       header itself via [hidden] would silently not work (see
       CLAUDE.md's hidden/toggle bug note). -->
  <div id="staff-dashboard" hidden>

  <!-- Shown if marking an order printed ever fails (e.g. lost
       permissions): auto-print stops so nothing prints in a loop. -->
  <div id="autoprint-halted-banner" class="staff-banner" hidden>
    自動列印已暫停：訂單已列印但無法標記為「已列印」。請重新整理頁面，若仍發生請重新登入。
  </div>

  <header class="staff-header">
    <div class="staff-header-left">
      <img class="logo-placeholder" src="../assets/logo.png?v=20260928" width="42" height="42" alt="樂福" />
      <div class="shop-header-text">
        <h1 id="staff-shop-name">載入中…</h1>
        <p class="staff-subtitle">訂單</p>
      </div>
    </div>
    <button id="connect-printer-btn" class="connect-btn">🖨️ 連接印表機</button>
    <button id="stored-value-btn" class="connect-btn stored-value-btn">💰 會員儲值</button>
    <button id="staff-signout-btn" class="signout-btn" type="button">登出</button>
  </header>

  <div class="columns">
    <section class="column">
      <h2 class="col-title pending">待處理</h2>
      <div id="col-pending" class="order-cards"></div>
    </section>
    <section class="column">
      <h2 class="col-title preparing">製作中</h2>
      <div id="col-preparing" class="order-cards"></div>
    </section>
    <section class="column">
      <h2 class="col-title ready">可取餐</h2>
      <div id="col-ready" class="order-cards"></div>
    </section>
  </div>

  <!-- Test orders (is_test = true) — kept out of the three live
       columns and out of auto-print entirely (see refresh()/
       autoPrintPendingOrders() in staff.js), but still checkable here:
       Print/Preview/status buttons all work the same as a live order.
       <details> so staff can collapse it out of the way during
       service instead of it competing for attention with the live
       queue — closed by default; staff.js only ever touches the
       [hidden] attribute (whether it shows at all), never `open`
       (collapsed/expanded), so a staff member's manual toggle survives
       every 5s refresh() poll instead of snapping back open/closed
       underneath them. Hidden entirely when there's nothing to show. -->
  <details id="test-orders-section" class="test-orders-section" hidden>
    <summary class="test-orders-heading">🧪 測試訂單（不會自動列印）</summary>
    <div id="col-test" class="order-cards"></div>
  </details>

  </div><!-- /#staff-dashboard -->

  <!-- Receipt preview — plain-text rendering of buildReceiptModel(),
       so print.js's layout/alignment can be checked without a
       physical test print. See ThermalPrinter.buildReceiptPreview. -->
  <div id="receipt-preview-backdrop" class="preview-backdrop" hidden></div>
  <div id="receipt-preview" class="receipt-preview" hidden aria-label="Receipt preview">
    <div class="receipt-preview-header">
      <span>收據預覽</span>
      <button id="receipt-preview-close" class="receipt-preview-close" aria-label="close">✕</button>
    </div>
    <div id="receipt-preview-body" class="receipt-preview-body"></div>
  </div>

  <!-- 會員儲值 (Stored Value) — opened by #stored-value-btn
       (staff.js: openStoredValuePanel()). Three sub-views toggled via
       [hidden] inside one sheet: search → confirm → success. Search
       hits `members` directly with the publishable key (RLS already
       permissive there, unchanged by this work); balance lookups and
       the actual top-up both go through PIN-gated Edge Functions
       (get-stored-value-balance-staff / topup-stored-value) — staff
       have no LINE identity of their own to gate on, unlike the
       customer-facing balance/spend functions. Closing via ✕/backdrop
       or finishing via "完成" both route through the same
       closeStoredValuePanel(), which always resets state — no stale
       search results, selected member, amount, or PIN left over for
       the next use. -->
  <div id="sv-backdrop" class="sheet-backdrop" hidden></div>
  <section id="sv-panel" class="checkout-sheet" hidden aria-label="會員儲值">
    <div class="sheet-handle"></div>
    <div class="sv-panel-header">
      <button id="sv-back" class="sv-back-inactive" aria-label="back">←</button>
      <h2 id="sv-panel-title">會員儲值</h2>
      <button id="sv-close" aria-label="close">✕</button>
    </div>

    <div id="sv-search-view">
      <input id="sv-search-input" class="note-input" type="text" placeholder="搜尋會員姓名" autocomplete="off" />
      <div id="sv-results" class="sv-results"></div>
    </div>

    <div id="sv-confirm-view" hidden>
      <div class="sv-member-card">
        <img id="sv-member-photo" class="sv-member-photo" alt="" hidden />
        <div id="sv-member-photo-placeholder" aria-hidden="true"></div>
        <div id="sv-member-name" class="sv-member-name"></div>
      </div>
      <div id="sv-balance-row" class="sv-balance-row">輸入PIN碼即可查詢餘額</div>

      <label class="note-label" for="sv-pin-input">員工PIN碼</label>
      <input id="sv-pin-input" class="note-input" type="password" inputmode="numeric" placeholder="PIN碼" autocomplete="off" />

      <label class="note-label" for="sv-amount-input">儲值金額</label>
      <input id="sv-amount-input" class="note-input" type="number" min="1" step="1" placeholder="NT$" />

      <div id="sv-error" class="sv-error" hidden></div>
      <button id="sv-submit" class="submit-btn">確認儲值</button>
    </div>

    <div id="sv-success-view" hidden>
      <p id="sv-success-message" class="sv-success-message"></p>
      <button id="sv-done" class="submit-btn">完成</button>
    </div>
  </section>

  <template id="order-card-template">
    <div class="order-card">
      <div class="order-card-top">
        <span class="order-id"></span>
        <span class="order-time"></span>
      </div>
      <div class="order-items"></div>
      <div class="order-note"></div>
      <div class="order-total"></div>
      <div class="order-actions"></div>
    </div>
  </template>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
  <script src="../supabase-config.js?v=20260927-2"></script>
  <script src="../print.js?v=20260927"></script>
  <script src="staff.js?v=20260928-2"></script>
</body>
</html>
